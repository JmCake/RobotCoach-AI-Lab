<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>人形机器人急弯试跑</title>
  <link rel="stylesheet" href="../assets/experiment.css">
  <link rel="stylesheet" href="../assets/motion/course-trial.css">
</head>
<body class="trial-page">
  <main class="course-motion-grid trial-grid">
    <div class="trial-field">
      <div class="course-track trial-stage">
        <canvas id="motionCanvas" aria-label="双足人形机器人在红色急弯跑道上试跑"></canvas>
        <span id="motionState" class="track-state"></span>
      </div>
      <div class="distance-lanes" aria-label="40 米试跑距离对照">
        <div class="distance-lane" id="baselineLane"><span>初代机</span><i aria-hidden="true"><b></b></i><output aria-live="off"></output></div>
        <div class="distance-lane" id="studentLane" hidden><span>我的配置</span><i aria-hidden="true"><b></b></i><output aria-live="off"></output></div>
        <p id="distanceDelta" hidden></p>
      </div>
    </div>
    <aside class="trial-console">
      <fieldset id="trialModes" class="trial-modes" hidden>
        <legend>选择试跑配置</legend>
        <button type="button" data-setup="student" aria-pressed="true">我的配置</button>
        <button type="button" data-setup="baseline" aria-pressed="false">初代机对照</button>
      </fieldset>
      <div class="scoreboard">
        <span>试跑距离</span><strong id="distance"></strong>
        <p id="installed"></p>
      </div>
      <fieldset id="prediction" hidden>
        <legend>全班预测</legend>
        <button data-guess="pass" type="button" aria-pressed="false">能完赛</button>
        <button data-guess="fail" type="button" aria-pressed="false">会失误</button>
      </fieldset>
      <button type="button" class="primary" id="play">开始试跑</button>
      <p id="verdict" role="status" hidden></p>
      <div class="trial-results">
        <div id="studentResult" class="feedback" role="status" hidden></div>
        <div id="baselineResult" class="feedback" role="status"></div>
      </div>
      <p id="runFeedback" class="muted" hidden></p>
      <details class="trial-details">
        <summary>试跑条件</summary>
        <p id="conditions"></p>
        <p>离开本页后，未完成的试跑会从起点重来。</p>
      </details>
      <p id="demoEntry" class="trial-link" hidden><a id="motionLink" href="../demo-motion.html" target="_top">打开独立人形机器人 Demo →</a></p>
    </aside>
  </main>
  <script type="module" src="../assets/motion/course-trial.js"></script>
  <script src="../assets/frame.js"></script>
</body>
</html>
