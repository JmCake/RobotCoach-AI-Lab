<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>跟教练学越障</title>
  <link rel="stylesheet" href="../assets/experiment.css">
  <link rel="stylesheet" href="../assets/motion/course-trial.css">
  <style>
    .lanes { display:grid; gap:12px; }
    .lanes.compare { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .lane header { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:6px; }
    .lane h2 { margin:0; font-size:18px; }
    .lane strong { color:#d3f56f; font-variant-numeric:tabular-nums; }
    .lane .course-track canvas { display:block; width:100%; height:auto; aspect-ratio:2.6; }
    .compare .course-track canvas { aspect-ratio:2; }
    @media(max-width:600px){ .lanes.compare { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div id="lanes" class="lanes">
    <section class="lane">
      <header><h2 id="firstTitle">教练示范</h2><strong id="firstCount"></strong></header>
      <div class="course-track"><canvas id="first" width="800" height="300" aria-labelledby="firstTitle"></canvas><p class="track-speech" hidden></p></div>
    </section>
    <section class="lane" id="secondLane" hidden>
      <header><h2 id="secondTitle">看过示范</h2><strong id="secondCount"></strong></header>
      <div class="course-track"><canvas id="second" width="800" height="300" aria-labelledby="secondTitle"></canvas><p class="track-speech" hidden></p></div>
    </section>
  </div>
  <div class="controls">
    <button id="demo" class="primary">看教练示范，再试跑</button>
    <button id="change" hidden>移近第一栏再试</button>
  </div>
  <div class="feedback" id="feedback" role="status"></div>
  <script type="module" src="../assets/imitation.js"></script>
  <script src="../assets/frame.js"></script>
</body>
</html>
