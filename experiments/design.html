<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>综合机器人方案</title><link rel="stylesheet" href="../assets/experiment.css"><style>.design{max-width:850px;margin:auto}.choices button{display:flex;flex-direction:column;align-items:center;gap:4px}.choices .icon{font-size:25px}.summary{border-top:1px solid #465267;padding-top:16px;margin-top:22px}.summary h2{font-size:19px;margin:0 0 8px}.system{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px 0;color:#9ee4ce}.system span{border:1px solid #496f6a;border-radius:8px;padding:8px 14px}</style></head><body><div class="design"><div id="choices"></div><div class="feedback" id="result" role="status"></div><div class="system" aria-label="机器人系统组合"><span>👁️ 感知</span>→<span>🧠 决策</span>→<span>⚡ 行动</span>↩</div><div class="summary"><h2>你已走过完整的机器人学习闭环</h2><p>感官带来信息，学习改变选择，行动之后继续观察。</p><p>把这三个问题带到下一次设计：需要知道什么？如何作出选择？怎样确认行动有效？</p><p class="muted">以上组合是方案说明；尚未在真实机器人或复杂场景中验证。</p></div></div>
<script type="module">
import {load,save,storageNotice} from '../assets/state.js';import {sensors} from '../assets/sensors.js';
const config=load().design;
const groups=[['scene','使用场景',[['🏫','校园'],['🏭','工厂'],['🌳','公园']]],['task','执行任务',[['📦','递送物品'],['🔎','巡检避障'],['🤝','引导行人']]],['sensors','感知配置',Object.entries(sensors).map(([id,d])=>[d.icon,id,d.name])],['training','训练方式',[['📏','规则控制'],['👀','模仿示范'],['🔁','自主试错']]],['feedback','反馈方式',[['👁️','重新观察'],['🦶','触地确认'],['🛑','异常停车']]]];
function render(){const host=document.getElementById('choices');host.replaceChildren();for(const [key,title,options] of groups){const field=document.createElement('fieldset'),legend=document.createElement('legend'),choices=document.createElement('div');legend.textContent=title;choices.className='choices';for(const [icon,value,label] of options){const b=document.createElement('button');b.setAttribute('aria-pressed',key==='sensors'?config.sensors.includes(value):config[key]===value);b.innerHTML=`<span class="icon" aria-hidden="true">${icon}</span><span>${label||value}</span>`;b.onclick=()=>{if(key==='sensors')config.sensors=config.sensors.includes(value)?config.sensors.filter(x=>x!==value):[...config.sensors,value];else config[key]=value;storageNotice(save({design:config}));render();};choices.append(b);}field.append(legend,choices);host.append(field);}
const selected=config.sensors.map(k=>sensors[k]?.name).filter(Boolean);document.getElementById('result').textContent=`在${config.scene}中${config.task}：${selected.length?'使用'+selected.join('、')+'获取信息':'尚未选择感官，系统无法取得环境信息'}；通过${config.training}形成动作选择，以${config.feedback}检查行动结果。`+(config.training==='模仿示范'?' 模仿方案还需要采集示范并验证新环境表现。':config.training==='自主试错'?' 奖励要对应任务完成，训练结果仍需测试。':' 规则需覆盖常见情况与异常处理。');}
if(!Array.isArray(config.sensors))config.sensors=['camera'];render();
</script><script src="../assets/frame.js"></script></body></html>
