<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>人形机器人越障短道</title>
  <link rel="stylesheet" href="../assets/experiment.css">
  <link rel="stylesheet" href="../assets/motion/course-trial.css">
  <link rel="stylesheet" href="../assets/motion/course-learning.css">
</head>
<body>
  <p id="conditions" class="muted trial-conditions"></p>
  <p id="roles" class="trial-sensors"></p>
  <div class="course-motion-grid">
    <div class="course-track">
      <canvas id="motionCanvas" tabindex="0" aria-label="双足人形机器人越过矮栏与横梁"></canvas>
    </div>
    <div class="motion-side">
      <section id="frozen" hidden>
        <div class="lab-controls">
          <button id="compare" class="primary" type="button">比较训练前后 · 各 20 轮</button>
          <button id="cancelCompare" type="button" hidden>取消比较</button>
        </div>
        <p id="comparisonStatus" class="muted" role="status"></p>
        <div id="comparison" hidden>
          <table>
            <thead><tr><th scope="col">留出赛道成绩</th><th scope="col">训练前</th><th scope="col">训练后</th></tr></thead>
            <tbody id="comparisonRows"></tbody>
          </table>
          <details class="lab-details">
            <summary>逐轮成绩与失败原因</summary>
            <ol id="rounds" class="rounds"></ol>
          </details>
        </div>
        <label class="policy-select">短道预览
          <select id="policy">
            <option value="after">训练后策略</option>
            <option value="before">训练前策略</option>
            <option value="rule">规则参考</option>
          </select>
        </label>
      </section>

      <div class="lab-controls">
        <button id="play" class="primary" type="button">开始</button>
        <button id="retry" type="button" hidden>回起点</button>
        <button id="jump" type="button" hidden>↑ 跳跃</button>
        <button id="duck" type="button" aria-pressed="false" hidden>↓ 下蹲</button>
      </div>
      <div class="lab-metrics">
        <span id="distance"></span>
        <span id="passed"></span>
        <span id="motionState"></span>
      </div>
      <p id="sensed" class="muted"></p>
      <p id="feedback" class="feedback" role="status"></p>

      <section id="training" hidden>
        <div class="lab-metrics">
          <span>完成轮次 <strong id="attempts"></strong></span>
          <span>Q 更新 <strong id="updates"></strong></span>
          <span id="lastEpisode"></span>
        </div>
        <a href="#showcase" id="showcaseLink" target="_top">比较训练前后 →</a>
        <details class="lab-details" id="trainingDetails">
          <summary>奖励规则与真实 Q 更新</summary>
          <p class="muted">每跨过一个障碍 +8，过线 +4，失败 −12。实际起跳 −0.03，每次下蹲决策 −0.02。</p>
          <p class="muted" id="exploration"></p>
          <p class="muted" id="rewardBreakdown"></p>
          <div class="lab-table-scroll" tabindex="0" aria-label="最近 Q 值更新，可左右滑动">
            <table>
              <thead><tr><th scope="col">更新</th><th scope="col">观测状态</th><th scope="col">动作</th><th scope="col">奖励</th><th scope="col">Q 值</th></tr></thead>
              <tbody id="auditRows"></tbody>
            </table>
          </div>
          <button id="reset" type="button">清空人形训练</button>
        </details>
      </section>
      <details class="lab-details">
        <summary>实验条件与操作</summary>
        <p class="muted">物理每秒更新 120 次，每 0.1 秒选择一次动作。跳跃在该次决策开始时发出，腾空时拒绝再次起跳；下蹲保持到下一次决策。</p>
        <p class="muted" id="modeNotes"></p>
        <a id="legacy" target="_top" href="runner.html">打开旧版 Runner 实验</a>
      </details>
    </div>
  </div>
  <script type="module" src="../assets/motion/course-learning.js"></script>
  <script src="../assets/frame.js"></script>
</body>
</html>
