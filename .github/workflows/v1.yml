name: V1 verification
on:
  pull_request:
  push:
    branches: [main, codex/v1-foundation, 'codex/v1.1-*']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run check
      - run: npm run test:e2e
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v1-static-site-and-test-evidence
          path: |
            dist/
            test-results/
